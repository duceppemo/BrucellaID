name: publish

# Publish to PyPI when a GitHub release is published, using PyPI trusted publishing (no API token needed).
# PyPI must list this repository, this workflow file and the "pypi" environment as a trusted publisher.
on:
  release:
    types: [published]

jobs:
  build:
    # v0.1 is the clone-and-run version, tagged for reference: there is no package at that tag, so there is
    # nothing to publish from it.
    if: github.event.release.tag_name != 'v0.1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - name: Check that the package version matches the release tag
        run: |
          version=$(python -c 'import brucellaid; print(brucellaid.__version__)')
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Package version ${version} does not match release tag ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
      - run: python -m build
      - name: Check that the reference data is in the wheel
        run: |
          python - <<'PY'
          import glob
          import zipfile

          wheel = glob.glob('dist/*.whl')[0]
          names = zipfile.ZipFile(wheel).namelist()
          for name in ('references_extended.msh', 'references_extended.tsv', 'references.msh',
                       'references.tsv', 'mlst_alleles.fasta', 'mlst_profiles.tsv',
                       'mlst_st_species.tsv', 'logo.svg', 'logo.png'):
              assert 'brucellaid/data/{}'.format(name) in names, (name, names)
          print('{}: the nine data files are there'.format(wheel))
          PY
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/brucellaid/
    permissions:
      id-token: write  # Trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
