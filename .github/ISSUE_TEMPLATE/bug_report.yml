name: Bug report
description: Something does not work as expected, or a species or sequence type looks wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Please check the [troubleshooting page](https://github.com/duceppemo/BrucellaID/wiki/Troubleshooting) and the [FAQ](https://github.com/duceppemo/BrucellaID/wiki/FAQ) first.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `brucellaid --version`
      placeholder: brucellaid 1.0.0
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: The exact command you ran
      render: shell
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
      description: For a species or a sequence type that looks wrong, please include the row of `brucellaid.tsv`, the rows of `brucellaid_mlst.tsv` and `brucellaid_mash.tsv` for that sample, and what you expected the answer to be.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Messages printed by brucellaid, ideally from a run with `--verbose`
      render: text
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, how you installed BrucellaID (bioconda, pip, a clone), MASH version (`mash --version`) and BBTools version (`seal.sh --version`)
      placeholder: Ubuntu 24.04, bioconda, MASH 2.3, BBTools 39.13
